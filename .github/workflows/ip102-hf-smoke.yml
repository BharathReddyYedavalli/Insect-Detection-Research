name: Hugging Face IP102 smoke tests

on:
  pull_request:
    paths:
      - "experiments/ip102_hf_study/**"
      - "tests/test_ip102_hf_study.py"
      - ".github/workflows/ip102-hf-smoke.yml"
  workflow_dispatch:

jobs:
  hf-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch CPU (no model downloads)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install study dependencies
        run: pip install -r experiments/ip102_hf_study/requirements.txt
      - name: Run offline HF study smoke tests
        run: python -m pytest tests/test_ip102_hf_study.py -q
